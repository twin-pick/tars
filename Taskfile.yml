version: "3"

tasks:
  build:
    desc: Build the binary
    cmds:
      - go build -o bin/tars cmd/main.go

  dev:
    desc: Run the program in development mode
    deps: [build, env]
    cmds:
      - ./bin/tars

  test:
    desc: Run tests
    cmds:
      - go test -v ./src

  rel:
    desc: Push a new release
    cmds:
      - git tag v{{ .CLI_ARGS }}
      - git push origin v{{ .CLI_ARGS }}

  env:
    desc: Set up environment variables
    silent: true
    cmds:
      - chmod +x ./scripts/setup_env.sh
      - ./scripts/setup_env.sh
